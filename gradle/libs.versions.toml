[versions]
coroutines = "1.11.0"
navigation = "2.9.8"
lifecycle = "2.11.0"
ktor = "3.5.2"
kotlinxSerialization = "1.11.0"
koin-android = "4.2.2"
coil-core = "3.5.0"
espresso = "3.7.0"
junit_ktx = "1.3.0"
support_runner = "1.7.0"
compose_bom = "2026.06.01"
composeActivity = "1.13.0"
androidGradlePlugin = "9.2.1"
kotlin = "2.4.10"
# Compose Multiplatform Gradle plugin + org.jetbrains.compose.* libraries used from commonMain.
composeMultiplatform = "1.12.0"

[libraries]
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil-core" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil-core" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil-core" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin-android" }
koin-core-viewmodel = { group = "io.insert-koin", name = "koin-core-viewmodel", version.ref = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin-android" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin-android" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin-android"}
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin-android" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "support_runner" }
test-rules = { group = "androidx.test", name = "rules", version.ref = "support_runner" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
espresso-web = { group = "androidx.test.espresso", name = "espresso-web", version.ref = "espresso" }
espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espresso" }
espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espresso" }
test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "support_runner" }
junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "junit_ktx" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose_bom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "composeActivity" }
compose-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

[bundles]
remoteImages = ["coil", "coil-compose", "coil-network-ktor3"]
ktor = [
    "ktor-client-core", "ktor-client-content-negotiation", "ktor-client-logging",
    "ktor-serialization-kotlinx-json", "kotlinx-serialization-json"
]
test = [
    "coroutines-test"
]
androidTest = [
    "test-runner", "test-rules", "espresso-core", "espresso-web", "espresso-contrib",
    "espresso-intents", "test-core-ktx", "junit-ktx",
]
[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
